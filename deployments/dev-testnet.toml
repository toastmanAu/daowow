# DAOWOW dev deployment for gate 2 — testnet.
#
# Superseded by gate 4's hardened deployment. Its purpose is to make the dApp
# demonstrable and to surface RPC, indexer and pool behaviour early.
#
# enable_type_id = false on every cell. These are plain code cells, so a
# script's code hash IS the data hash of its binary and a rebuilt binary is a
# DIFFERENT script rather than a silent reinterpretation of cells already live
# under the old one. A Type ID deployment would hold the code hash constant
# while the binary behind it changed, which for a round already open is the
# ability to change the rules underneath it. See the 2a spec, "Deploy as data1".
#
# [lock] is the deployer's own lock, NOT --zero-lock: the capacity stays
# reclaimable once gate 4 supersedes this, exactly as the superseded
# deployments reclaimed in docs/reclaim-testnet-capacity.md were.

[[cells]]
name = "round-type"
enable_type_id = false
location = { file = "target/riscv64imac-unknown-none-elf/release/round-type" }

[[cells]]
name = "entry-shard-type"
enable_type_id = false
location = { file = "target/riscv64imac-unknown-none-elf/release/entry-shard-type" }

[[cells]]
name = "entry-lock"
enable_type_id = false
location = { file = "target/riscv64imac-unknown-none-elf/release/entry-lock" }

[[cells]]
name = "dao-lock"
enable_type_id = false
location = { file = "target/riscv64imac-unknown-none-elf/release/dao-lock" }

[[cells]]
name = "settlement-type"
enable_type_id = false
location = { file = "target/riscv64imac-unknown-none-elf/release/settlement-type" }

# The lock placed on every deployed code cell: the deployer's own
# secp256k1_blake160_sighash_all, so the capacity can be recovered later.
[lock]
code_hash = "0x9bd7e06f3ecf4be0f2fcd2188b23f1b9fcc88e5d4b65a8637b17723bbda3cce8"
args = "0xa776bf02d19cafa3749d906cc2c9ab1cf1e80ff7"
hash_type = "type"
